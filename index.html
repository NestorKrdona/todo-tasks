<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="number"],
        input[type="text"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-update {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(250, 112, 154, 0.4);
        }

        .btn-load {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .tasks-section {
            margin-top: 30px;
        }

        .tasks-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .task-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }

        .task-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .task-id {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .task-name {
            font-size: 1.3em;
            color: #333;
            margin: 10px 0;
            font-weight: 600;
        }

        .task-deadline {
            color: #666;
            font-size: 0.95em;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .tasks-grid {
                grid-template-columns: 1fr;
            }

            .btn-container {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Gestión de Tareas</h1>
            <p>Organiza y administra tus tareas de manera eficiente</p>
        </header>

        <div class="content">
            <div id="message"></div>

            <div class="form-section">
                <h2>Agregar/Actualizar Tarea</h2>
                <div class="form-group">
                    <label for="taskId">ID de Tarea</label>
                    <input type="number" id="taskId" placeholder="Ej: 1">
                </div>
                <div class="form-group">
                    <label for="taskName">Nombre de la Tarea</label>
                    <input type="text" id="taskName" placeholder="Ej: Completar proyecto">
                </div>
                <div class="form-group">
                    <label for="taskDeadline">Fecha Límite</label>
                    <input type="datetime-local" id="taskDeadline">
                </div>
                <div class="btn-container">
                    <button class="btn-primary" onclick="createTask()">Crear Tarea</button>
                    <button class="btn-update" onclick="updateTask()">Actualizar Tarea</button>
                    <button class="btn-delete" onclick="deleteTask()">Eliminar Tarea</button>
                    <button class="btn-load" onclick="loadTasks()">Cargar Tareas</button>
                </div>
            </div>

            <div class="tasks-section">
                <h2>Mis Tareas</h2>
                <div id="tasksList" class="tasks-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        async function createTask() {
            const taskId = document.getElementById('taskId').value;
            const taskName = document.getElementById('taskName').value;
            const taskDeadline = document.getElementById('taskDeadline').value;

            if (!taskId || !taskName || !taskDeadline) {
                showMessage('Por favor completa todos los campos', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/create-task`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        TaskId: parseInt(taskId),
                        Name: taskName,
                        Deadline: new Date(taskDeadline)
                    })
                });

                if (response.ok) {
                    showMessage('Tarea creada exitosamente', 'success');
                    clearForm();
                    loadTasks();
                } else {
                    showMessage('Error al crear la tarea', 'error');
                }
            } catch (error) {
                showMessage('Error de conexión: ' + error.message, 'error');
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch(`${API_URL}/all-tasks`);
                const tasks = await response.json();

                const tasksList = document.getElementById('tasksList');

                if (tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <h3>No hay tareas</h3>
                            <p>Comienza agregando tu primera tarea</p>
                        </div>
                    `;
                } else {
                    tasksList.innerHTML = tasks.map(task => `
                        <div class="task-card">
                            <span class="task-id">ID: ${task.TaskId}</span>
                            <h3 class="task-name">${task.Name}</h3>
                            <p class="task-deadline">
                                📅 ${new Date(task.Deadline).toLocaleString('es-ES', {
                                    year: 'numeric',
                                    month: 'long',
                                    day: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}
                            </p>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showMessage('Error al cargar las tareas: ' + error.message, 'error');
            }
        }

        async function updateTask() {
            const taskId = document.getElementById('taskId').value;
            const taskName = document.getElementById('taskName').value;
            const taskDeadline = document.getElementById('taskDeadline').value;

            if (!taskId || !taskName || !taskDeadline) {
                showMessage('Por favor completa todos los campos', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/update-task`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        TaskId: parseInt(taskId),
                        Name: taskName,
                        Deadline: new Date(taskDeadline)
                    })
                });

                if (response.ok) {
                    showMessage('Tarea actualizada exitosamente', 'success');
                    clearForm();
                    loadTasks();
                } else {
                    showMessage('Error al actualizar la tarea', 'error');
                }
            } catch (error) {
                showMessage('Error de conexión: ' + error.message, 'error');
            }
        }

        async function deleteTask() {
            const taskId = document.getElementById('taskId').value;

            if (!taskId) {
                showMessage('Por favor ingresa el ID de la tarea a eliminar', 'error');
                return;
            }

            if (!confirm('¿Estás seguro de eliminar esta tarea?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/delete-task`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        TaskId: parseInt(taskId)
                    })
                });

                if (response.ok) {
                    showMessage('Tarea eliminada exitosamente', 'success');
                    clearForm();
                    loadTasks();
                } else {
                    showMessage('Error al eliminar la tarea', 'error');
                }
            } catch (error) {
                showMessage('Error de conexión: ' + error.message, 'error');
            }
        }

        function clearForm() {
            document.getElementById('taskId').value = '';
            document.getElementById('taskName').value = '';
            document.getElementById('taskDeadline').value = '';
        }

        // Cargar tareas al iniciar
        window.addEventListener('DOMContentLoaded', loadTasks);
    </script>
</body>
</html>
